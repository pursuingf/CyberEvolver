agent:
  agent_code: baseline/agents/t_agent.py
  # Prompt construction intentionally lives in baseline/agents/t_agent.py
  # so it can mirror upstream HPTSA and render runtime target_url.
  step_limit: 10
  model_kwargs:
    temperature: 0.7

docker_environment:
  image: "ctfenv"
  network_name: "ctfnet"
  timeout: 150

challenge_client:
  benchmark_root: "./bench_hub/benchmarks"
  run_mode: "remote"
  server_url: "http://10.1.2.146:8000"
  use_ssh_tunnel: false

logging:
  level: "DEBUG"
  log_dir: "baseline/logs/v2"
  console_output: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
