agent:
  agent_code: baseline/agents/vulnbot.py
  # Prompt construction lives in baseline/agents/vulnbot.py
  # mirroring upstream VulnBot's Collector->Scanner->Exploiter pipeline.
  step_limit: 30
  model_kwargs:
    temperature: 0.5
  # Per-role react cap.  Upstream default is 5 (pentest.py:81 / role.py:21);
  # we raise to 10 so the 30-step total budget is split evenly across
  # Collector / Scanner / Exploiter (3 × 10 = 30) instead of capping at 15
  # effective steps.  Empirically web_security needs > 5 in Exploiter to try
  # multiple LFI payloads.
  agent_kwargs:
    max_interactions: 10

docker_environment:
  image: "autopenenv"
  network_name: "ctfnet"
  timeout: 150

challenge_client:
  benchmark_root: "./bench_hub/benchmarks"
  run_mode: "remote"
  server_url: "http://10.1.2.146:8000"
  use_ssh_tunnel: false

logging:
  level: "DEBUG"
  log_dir: "baseline/logs/v2"
  console_output: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
