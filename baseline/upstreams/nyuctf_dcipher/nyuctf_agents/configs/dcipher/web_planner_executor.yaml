experiment:
  max_cost: 1.0
  enable_autoprompt: False

planner:
  max_rounds: 30
  model: deepseek-v3-ep
  api_endpoint: http://dsv3.sii.edu.cn/v1
  temperature: 1.0
  top_p: 1.0
  max_tokens: 4096
  prompt: prompts/web_planner_prompt.yaml
  toolset:
    - run_command
    - submit_flag
    - giveup
    - delegate
executor:
  max_rounds: 100
  model: deepseek-v3-ep
  api_endpoint: http://dsv3.sii.edu.cn/v1
  temperature: 1.0
  top_p: 1.0
  max_tokens: 4096
  len_observations: 5
  prompt: prompts/web_executor_prompt.yaml
  toolset:
    - run_command
    - finish_task
    - disassemble
    - decompile
    - create_file
autoprompter:
  max_rounds: 5
  model: deepseek-v3-ep
  api_endpoint: http://dsv3.sii.edu.cn/v1
  temperature: 1.0
  max_tokens: 4096
  prompt: prompts/autoprompt_prompt.yaml
  toolset:
    - run_command
    - generate_prompt
