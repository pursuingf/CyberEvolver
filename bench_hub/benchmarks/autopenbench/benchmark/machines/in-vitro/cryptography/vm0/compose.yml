services:
  in-vitro_cryptography_vm0:
    build: .
    image: in-vitro_cryptography_vm0
    tty: true
    init: true
    networks:
    - net-main_network
    command: bash -c " source /opt/venv/bin/activate && python3 /root/server.py &&
      tail -f /dev/null"
    restart: unless-stopped
    volumes:
    - ./flag:/root/flag
networks:
  net-main_network: {}
