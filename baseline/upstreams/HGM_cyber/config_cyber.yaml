# HGM Cyber configuration

llm:
  self_improve_llm: "Kimi-K2.5-cy"
  downstream_llm: "Kimi-K2.5-cy"
  diagnose_llm: "Kimi-K2.5-cy"

optimization:
  alpha: 0.6
  beta: 1.0
  cool_down: false
  eval_random_level: 1.0
  n_pseudo_descendant_evals: 10000

execution:
  max_workers: 8
  self_improve_timeout: 7200   # 2h safety net for self-improvement coding agent
  evaluation_timeout: 21600  # 6h safety net; step_limit is the real stopping condition
  max_task_evals: 40

evaluation:
  full_eval: false
  polyglot: false

paths:
  output_dir: null
  continue_from: null
  initial_agent_name: "default_agent"
