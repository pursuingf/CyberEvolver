[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersec_arena"
version = "0.1.0"
description = "Evolutionary CTF agent framework + challenge benchmark hub."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
mini-cyber = "mini_cyberagent.cli:main"

[tool.setuptools]
# Source layout is multi-package at the repo root, not src/.
packages = [
    "bench_hub",
    "bench_hub.adapters",
    "bench_hub.server",
    "common",
    "common.agent_runtime",
    "common.llm_dispatch",
    "common.utils",
    "cyber_evolver",
    "cyber_evolver.evolve",
    "mini_cyberagent",
    "mini_cyberagent.cli",
    "mini_cyberagent.commands",
    "run_evolve",
]

[tool.pytest.ini_options]
# Discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]

# Make the repo root importable so `from common.utils...` works without sys.path hacks
pythonpath = ["."]

# Avoid collecting upstream baselines and paper-writing scripts as tests
norecursedirs = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".venv",
    "logs",
    "reports",
    "paper_writing",
    "baseline/upstreams",
]

# Quieter output by default
addopts = ["-ra", "--tb=short"]

filterwarnings = [
    # FastAPI 0.110+ deprecation that we can't fix until we migrate to lifespan handlers
    "ignore:.*on_event is deprecated.*:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "baseline/upstreams",
    "paper_writing",
    "logs",
    "reports",
    ".pytest_cache",
]

[tool.ruff.lint]
# Start with a small, high-signal ruleset. Tighten later.
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort import order
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "PIE",    # flake8-pie
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (don't enforce; long URLs/strings exist)
    "E731",   # don't assign a lambda
    "E402",   # module-level import not at top (path bootstrap pattern)
    "B008",   # function call in default arg (FastAPI/Pydantic patterns)
    "B007",   # unused loop variable
    "B904",   # raise from inside except — many sites legitimately don't have a cause
    "UP007",  # `X | Y` typing — keep Optional[T] for clarity in some places
    "UP015",  # don't insist on omitting open() mode
    "UP024",  # OSError aliases — too noisy on transitional code
    "RUF012", # mutable class default annotation — false-positive heavy on dataclasses
    "RUF013", # implicit Optional — too pedantic for current code
]

[tool.ruff.lint.per-file-ignores]
# Tests use sys.modules pollution + dynamic import shenanigans
"tests/**/*.py" = ["E402", "F401", "F811", "B011"]
"bench_hub/server/test_*.py" = ["E402", "F401", "F811"]
# CLI entry scripts: print is fine
"run_*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = [
    "bench_hub",
    "common",
    "cyber_evolver",
    "mini_cyberagent",
    "run_evolve",
]
